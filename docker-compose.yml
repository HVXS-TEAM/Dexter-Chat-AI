# Dexter — local development stack (Phase 0)
# Services: postgres (pgvector), backend (FastAPI), frontend (React/Vite)
# Environment values are interpolated from the root .env file.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dexter_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dexter_network

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    networks:
      - dexter_network

volumes:
  pgdata:

networks:
  dexter_network:
    driver: bridge
